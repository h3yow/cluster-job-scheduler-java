server.port=0

# ===== 本地批处理调度器配置 =====
# 作业默认最大尝试次数（含首次执行）；作业可在提交时用 maxAttempts 覆盖
scheduler.default-max-attempts=3
# 等待队列容量（仅统计 QUEUED 作业）
scheduler.max-queue-capacity=1000
# 节点选择策略（当前支持 FIRST_FIT）
scheduler.node-selector=FIRST_FIT

# 进程内模拟集群节点（不配时默认为 node-1/node-2，各 8 核 / 16384MB）
scheduler.cluster.nodes[0].id=node-1
scheduler.cluster.nodes[0].cpu-cores=8
scheduler.cluster.nodes[0].memory-mb=16384
scheduler.cluster.nodes[1].id=node-2
scheduler.cluster.nodes[1].cpu-cores=8
scheduler.cluster.nodes[1].memory-mb=16384

# 租户配额示例：team-a 最多 2 个并发保活作业、8 核 / 16384MB
scheduler.quotas.team-a.max-jobs=2
scheduler.quotas.team-a.max-cpu-cores=8
scheduler.quotas.team-a.max-memory-mb=16384
# team-b 配额更宽松
scheduler.quotas.team-b.max-jobs=10
scheduler.quotas.team-b.max-cpu-cores=16
scheduler.quotas.team-b.max-memory-mb=32768
