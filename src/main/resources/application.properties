server.port=0

# ===== 本地批处理作业调度器配置（前缀 scheduler）=====

# 单个作业允许申请的资源上限（提交时校验，超出拒绝 JOB_QUOTA_EXCEEDED）
scheduler.max-job-cpu=8
scheduler.max-job-memory-mb=16384

# 单租户在集群内（排队 PENDING + 运行 RUNNING）的累计资源配额；0 表示该维不限
scheduler.tenant-cpu-quota=16
scheduler.tenant-memory-quota-mb=32768

# 每个作业的最大尝试次数（含首次执行）；达到上限进入终态 FAILED
scheduler.max-attempts=3
# 失败重试的基础退避(ms)，实际延迟 = retry-backoff-ms * 已尝试次数
scheduler.retry-backoff-ms=50
# 提交后是否立即尝试分派
scheduler.schedule-on-submit=true

# 模拟集群节点：名称:CPU核数:内存MB，逗号分隔
scheduler.nodes=node-1:8:16384,node-2:8:16384

# 打印调度关键输入与判定依据
logging.level.com.github.h3yow.clusterjobschedulerjava=INFO
